[project]
name = "cardforge"
version = "0.1.0"
description = "Generador modular de objetos planos 3D personalizados"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Javier Rodriguez" }
]

dependencies = [
    "qrcode>=7.4",
    "Pillow>=10.0",
    "svgwrite>=1.4",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
    "fastapi>=0.138.2",
    "uvicorn>=0.49.0",
    "manifold3d>=3.5.2",
    "fonttools>=4.63.0",
    "uharfbuzz>=0.55.0",
    "svgelements>=1.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]
# MCP server — lets an AI agent drive the compiler. Optional so the Core
# stays installable without it.
mcp = [
    "mcp>=2.0",
]

[project.scripts]
cardforge = "cardforge.cli:main"
cardforge-mcp = "cardforge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
]
