# CardForge Cloudflare tunnel — runs as a container on the Linux box, on the
# `coolify` docker network, forwarding public hostnames to Coolify's Traefik
# (coolify-proxy) which routes by Host header to the right app container.
#
# TLS terminates at the Cloudflare edge (proxied CNAMEs); traffic inside the
# tunnel and to Traefik is plain HTTP — so the box needs no public 80/443 and
# no Let's Encrypt.
#
# Tunnel: cardforge (86d2721e-ac76-4fbd-b301-6cf130c644ba)
# DNS routes created with:  cloudflared tunnel route dns --overwrite-dns <uuid> <host>

tunnel: 86d2721e-ac76-4fbd-b301-6cf130c644ba
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # ── Production (main branch) ──────────────────────────────────────────
  - hostname: cardforge.minarai.xyz
    service: http://coolify-proxy:80
  - hostname: cardforge-core.minarai.xyz
    service: http://coolify-proxy:80
  # ── Dev (dev branch) ──────────────────────────────────────────────────
  - hostname: cardforge-dev.minarai.xyz
    service: http://coolify-proxy:80
  - hostname: cardforge-core-dev.minarai.xyz
    service: http://coolify-proxy:80

  # ── Deploy webhook ────────────────────────────────────────────────────
  # Coolify's control plane can start containers on this box, so it is NOT
  # published. Only the one path GitHub posts to is reachable, on its own
  # hostname; every other path on it 404s before it ever reaches Coolify.
  # `path` is an unanchored regex, hence the explicit ^…$.
  #
  # Note this goes straight to `coolify:8080` (the app container's own nginx),
  # not through coolify-proxy — Traefik routes the *deployed apps*, and Coolify
  # itself is not one of them.
  - hostname: cardforge-hooks.minarai.xyz
    path: ^/webhooks/source/github/events/manual$
    service: http://coolify:8080
  - hostname: cardforge-hooks.minarai.xyz
    service: http_status:404

  # Anything else the tunnel receives → 404.
  - service: http_status:404
