# Studio SPA — single-page app served behind Coolify's Traefik + Cloudflare tunnel.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else falls back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, so a redeploy is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
